<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://raw.githubusercontent.com; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
<title>الدفتر الميداني</title>
<link rel="icon" href="../icons/icon-192.png" />
<link rel="apple-touch-icon" href="../icons/icon-512.png" />
<meta name="theme-color" content="#1d4ed8" />
<link rel="manifest" href="../manifest.webmanifest" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body data-root="false" data-title="الدفتر الميداني" data-page="fieldnotes">

<header id="appHeader"></header>
<main>
  <div class="card">
    <h2 id="noteFormTitle">ملاحظة جديدة</h2>
    <div class="field">
      <label for="noteText">النص</label>
      <textarea id="noteText" placeholder="اكتب ملاحظتك الميدانية هنا..."></textarea>
    </div>
    <div class="field" id="gpsPreview" hidden>
      <label>الموقع الملتقط</label>
      <div class="result-box" id="gpsBox"></div>
    </div>
    <div class="btn-row">
      <button type="button" class="btn secondary" id="btnGps">📍 التقاط الموقع</button>
      <button type="button" class="btn" id="btnSave">حفظ الملاحظة</button>
    </div>
    <button type="button" class="btn ghost sm" id="btnCancelEdit" hidden style="width:100%;margin-top:8px">إلغاء التعديل</button>
  </div>

  <div class="card">
    <div class="field" style="margin-bottom:0">
      <label for="search">بحث في الملاحظات</label>
      <input type="search" id="search" placeholder="اكتب كلمة للبحث..." style="direction:rtl;text-align:right" />
    </div>
  </div>

  <div class="section-title">الملاحظات المحفوظة (<span id="noteCount">0</span>)</div>
  <div id="notesList"></div>
  <div class="export-bar" id="exportBar" hidden></div>
</main>
<nav id="appNav"></nav>

<script src="../js/native-bundle.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/updater.js"></script>
<script src="../js/native-updater.js"></script>

<script src="../js/pages/fieldnotes.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
