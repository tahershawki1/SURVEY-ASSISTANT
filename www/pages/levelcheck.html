<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://raw.githubusercontent.com; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
<title>التحقق من المناسيب</title>
<link rel="icon" href="../icons/icon-192.png" />
<link rel="apple-touch-icon" href="../icons/icon-512.png" />
<meta name="theme-color" content="#1d4ed8" />
<link rel="manifest" href="../manifest.webmanifest" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body data-root="false" data-title="التحقق من المناسيب" data-page="levelcheck">

<header id="appHeader"></header>
<div class="stage-dots" id="stageDots" role="list" aria-label="مراحل التحقق">
  <div class="dot active" data-dot="1" role="listitem" aria-label="المرحلة 1">1</div>
  <div class="sep" aria-hidden="true"></div>
  <div class="dot" data-dot="2" role="listitem" aria-label="المرحلة 2">2</div>
  <div class="sep" aria-hidden="true"></div>
  <div class="dot" data-dot="3" role="listitem" aria-label="المرحلة 3">3</div>
</div>
<main>
  <section class="card stage" id="stage1">
    <h2>المرحلة 1 من 3 — النقطة الثابتة (Benchmark)</h2>
    <div class="field">
      <label for="bmRL">منسوب النقطة الثابتة المعروف (متر)</label>
      <input type="number" step="any" inputmode="decimal" id="bmRL" placeholder="100.000" enterkeyhint="next" />
    </div>
    <div class="field">
      <label for="bmBS">قراءة الميزان على النقطة الثابتة (خلفية BS)</label>
      <input type="number" step="any" inputmode="decimal" id="bmBS" placeholder="1.500" enterkeyhint="next" />
    </div>
    <div class="result-box empty" id="hiPreview">أدخل القيمتين لحساب ارتفاع خط النظر (HI)</div>
    <button type="button" class="btn" id="next1" disabled style="margin-top:12px">التالي ↓</button>
  </section>

  <section class="card stage locked" id="stage2">
    <h2>المرحلة 2 من 3 — المنسوب المطلوب والسماحية</h2>
    <div class="field">
      <label for="targetRL">المنسوب المراد التحقق منه (متر)</label>
      <input type="number" step="any" inputmode="decimal" id="targetRL" placeholder="100.200" enterkeyhint="next" disabled />
    </div>
    <div class="field">
      <label for="tolProfile">نوع العمل (يحدد السماحية)</label>
      <select id="tolProfile" disabled></select>
    </div>
    <div class="field" id="customTolWrap" hidden>
      <label for="tolMM">السماحية (± مم)</label>
      <input type="number" step="any" inputmode="decimal" id="tolMM" value="5" disabled />
    </div>
    <button type="button" class="btn" id="next2" disabled>التالي ↓</button>
  </section>

  <section class="card stage locked" id="stage3">
    <h2>المرحلة 3 من 3 — القراءات الميدانية</h2>
    <div id="headline"></div>
    <div id="readingsWrap" hidden>
      <div class="readings-table">
        <div class="readings-row head"><span>القراءة</span><span>النتيجة</span><span></span></div>
        <div id="readingsBody"></div>
      </div>
    </div>
    <div class="empty-state" id="readingsEmpty"><div class="big" aria-hidden="true">📏</div>لم تُسجَّل أي قراءة بعد</div>

    <div class="field" style="margin-top:14px">
      <label for="fieldReading">القراءة الحالية على المكان</label>
      <input type="number" step="any" inputmode="decimal" id="fieldReading" placeholder="1.300" enterkeyhint="done" disabled />
    </div>
    <button type="button" class="btn" id="calcBtn" disabled>حساب</button>
    <div class="export-bar" id="exportBar" hidden></div>
    <button type="button" class="btn ghost" id="btnReset" style="margin-top:10px">إعادة الضبط وبدء تحقق جديد</button>
  </section>
</main>
<nav id="appNav"></nav>

<script src="../js/native-bundle.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/updater.js"></script>
<script src="../js/native-updater.js"></script>
<script src="../js/tools/levelcheck.js"></script>
<script src="../js/pages/levelcheck.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
