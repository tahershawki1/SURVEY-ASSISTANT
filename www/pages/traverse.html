<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>تسوية المضلعات</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<header class="app-header">
  <div class="title-row">
    <a href="../index.html" class="back-btn">→</a>
    <h1>تسوية المضلعات (Bowditch)</h1>
  </div>
  <a href="notifications.html" class="icon-btn">
    🔔
    <span class="badge hidden" data-notif-badge>0</span>
  </a>
</header>

<main>
  <div class="card">
    <h2>نقطة البداية</h2>
    <div class="row-2">
      <div class="field"><label>X (Easting)</label><input type="number" step="any" id="startX" value="0" /></div>
      <div class="field"><label>Y (Northing)</label><input type="number" step="any" id="startY" value="0" /></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);margin-top:4px">
      <input type="checkbox" id="closedLoop" checked onchange="toggleClose()" />
      مضلع مغلق (يعود إلى نقطة البداية)
    </label>
    <div id="closeToWrap" style="display:none;margin-top:10px">
      <div class="row-2">
        <div class="field"><label>X نقطة الإغلاق</label><input type="number" step="any" id="closeX" value="0" /></div>
        <div class="field"><label>Y نقطة الإغلاق</label><input type="number" step="any" id="closeY" value="0" /></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>الأضلاع (الأزيموث والمسافة)</h2>
    <div id="legsWrap"></div>
    <button class="btn secondary sm" onclick="addLeg()">+ إضافة ضلع</button>
  </div>

  <button class="btn" onclick="compute()" style="margin-bottom:14px">حساب التسوية</button>

  <div class="card">
    <h2>النتيجة</h2>
    <div class="result-box empty" id="result">أدخل الأضلاع ثم اضغط "حساب التسوية"</div>
  </div>
</main>

<nav class="bottom-nav">
  <a href="../index.html"><span class="ic">🏠</span>الرئيسية</a>
  <a href="fieldnotes.html"><span class="ic">📒</span>الدفتر</a>
  <a href="notifications.html"><span class="ic">🔔</span>الإشعارات</a>
  <a href="settings.html"><span class="ic">⚙️</span>الإعدادات</a>
</nav>

<script src="../js/native-bundle.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/updater.js"></script>
<script src="../js/native-updater.js"></script>
<script src="../js/tools/traverse.js"></script>
<script>
let legs = [
  { azimuth: 0, distance: 0 },
  { azimuth: 90, distance: 0 },
  { azimuth: 180, distance: 0 },
  { azimuth: 270, distance: 0 },
];

function toggleClose() {
  document.getElementById("closeToWrap").style.display = document.getElementById("closedLoop").checked ? "none" : "block";
}

function renderLegs() {
  const wrap = document.getElementById("legsWrap");
  wrap.innerHTML = legs
    .map(
      (l, i) => `
    <div class="card" style="padding:12px;margin-bottom:8px">
      <div class="row-3" style="align-items:flex-end">
        <div class="field" style="margin-bottom:0">
          <label>ضلع ${i + 1} — أزيموث °</label>
          <input type="number" step="any" value="${l.azimuth}" oninput="legs[${i}].azimuth=parseFloat(this.value)||0" />
        </div>
        <div class="field" style="margin-bottom:0">
          <label>المسافة m</label>
          <input type="number" step="any" value="${l.distance}" oninput="legs[${i}].distance=parseFloat(this.value)||0" />
        </div>
        <button class="btn danger sm" onclick="delLeg(${i})">حذف</button>
      </div>
    </div>`
    )
    .join("");
}

function addLeg() {
  legs.push({ azimuth: 0, distance: 0 });
  renderLegs();
}

function delLeg(i) {
  legs.splice(i, 1);
  renderLegs();
}

function compute() {
  const start = { x: parseFloat(document.getElementById("startX").value) || 0, y: parseFloat(document.getElementById("startY").value) || 0 };
  const isClosed = document.getElementById("closedLoop").checked;
  const closeTo = isClosed
    ? start
    : { x: parseFloat(document.getElementById("closeX").value) || 0, y: parseFloat(document.getElementById("closeY").value) || 0 };

  const res = Traverse.compute(start, legs, closeTo);
  const box = document.getElementById("result");

  const legsRows = res.legs
    .map(
      (l, i) => `<div class="row"><span>ضلع ${i + 1} (${l.distance} m)</span><b>ΔN: ${l.adjLat.toFixed(3)} | ΔE: ${l.adjDep.toFixed(3)}</b></div>`
    )
    .join("");

  const pointsRows = res.points
    .map((p, i) => `<div class="row"><span>نقطة ${i}</span><b>X: ${p.x.toFixed(3)} | Y: ${p.y.toFixed(3)}</b></div>`)
    .join("");

  const precisionText = res.precision === Infinity ? "مضبوط تمامًا" : `1 : ${Math.round(res.precision)}`;
  const isGood = res.precision === Infinity || res.precision >= 5000;

  box.className = "result-box";
  box.innerHTML = `
    <div class="row"><span>مجموع الأطوال</span><b>${res.sumDist.toFixed(3)} m</b></div>
    <div class="row"><span>خطأ الإغلاق (Lat / Dep)</span><b>${res.errorLat.toFixed(4)} / ${res.errorDep.toFixed(4)}</b></div>
    <div class="row"><span>الخطأ الخطي</span><b>${res.misclosure.toFixed(4)} m</b></div>
    <div class="row"><span>الدقة النسبية</span><b style="color:${isGood ? "var(--success)" : "var(--danger)"}">${precisionText}</b></div>
    <div class="section-title" style="margin-top:10px">الإحداثيات المعدّلة للأضلاع</div>
    ${legsRows}
    <div class="section-title" style="margin-top:10px">إحداثيات النقاط بعد التسوية</div>
    ${pointsRows}
  `;
}

renderLegs();
toggleClose();
</script>
<script src="../js/app.js"></script>
</body>
</html>
