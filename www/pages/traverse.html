<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://raw.githubusercontent.com; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
<title>تسوية المضلعات</title>
<link rel="icon" href="../icons/icon-192.png" />
<link rel="apple-touch-icon" href="../icons/icon-512.png" />
<meta name="theme-color" content="#1d4ed8" />
<link rel="manifest" href="../manifest.webmanifest" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body data-root="false" data-title="تسوية المضلعات" data-page="traverse">

<header id="appHeader"></header>
<main>
  <div class="card">
    <h2>نقطة البداية</h2>
    <div class="row-2">
      <div class="field"><label for="startX">X (Easting)</label><input type="number" step="any" inputmode="decimal" id="startX" value="0" /></div>
      <div class="field"><label for="startY">Y (Northing)</label><input type="number" step="any" inputmode="decimal" id="startY" value="0" /></div>
    </div>
    <label class="check-row"><input type="checkbox" id="closedLoop" checked /> مضلع مغلق (يعود إلى نقطة البداية)</label>
    <div id="closeToWrap" hidden>
      <div class="row-2">
        <div class="field"><label for="closeX">X نقطة الإغلاق</label><input type="number" step="any" inputmode="decimal" id="closeX" value="0" /></div>
        <div class="field"><label for="closeY">Y نقطة الإغلاق</label><input type="number" step="any" inputmode="decimal" id="closeY" value="0" /></div>
      </div>
    </div>
    <div class="field" style="margin-top:10px">
      <label for="method">طريقة التسوية</label>
      <select id="method">
        <option value="bowditch">Bowditch — قاعدة البوصلة (المسافات والزوايا بنفس الدقة)</option>
        <option value="transit">Transit — قاعدة العبور (الزوايا أدقّ من المسافات)</option>
      </select>
    </div>
  </div>

  <div class="card">
    <h2>تسوية الزوايا (اختياري)</h2>
    <p class="subtitle" style="margin-bottom:10px">أدخل الزوايا الداخلية المرصودة لتوزيع خطأ الإغلاق الزاوي واشتقاق الأزيموثات المصححة تلقائيًا.</p>
    <label class="check-row"><input type="checkbox" id="useAngles" /> حساب الأزيموثات من الزوايا المرصودة</label>
    <div id="anglesWrap" hidden>
      <div class="field">
        <label for="startAz">أزيموث الضلع الأول (درجات)</label>
        <input type="number" step="any" inputmode="decimal" id="startAz" value="0" />
      </div>
      <div id="anglesList"></div>
      <div id="angleResult"></div>
    </div>
  </div>

  <div class="card">
    <h2>الأضلاع (الأزيموث والمسافة)</h2>
    <div id="legsWrap"></div>
    <div class="btn-row" style="margin-top:10px">
      <button type="button" class="btn secondary sm" id="btnAddLeg">+ إضافة ضلع</button>
      <button type="button" class="btn ghost sm" id="btnResetLegs">مسح الأضلاع</button>
    </div>
  </div>

  <button type="button" class="btn" id="btnCompute" style="margin-bottom:13px">حساب التسوية</button>

  <div class="card">
    <h2>النتيجة</h2>
    <div id="messages"></div>
    <div id="headline"></div>
    <div id="result" class="result-box empty">أدخل الأضلاع ثم اضغط «حساب التسوية»</div>
    <div class="export-bar" id="exportBar" hidden></div>
  </div>
</main>
<nav id="appNav"></nav>

<script src="../js/native-bundle.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/updater.js"></script>
<script src="../js/native-updater.js"></script>
<script src="../js/tools/traverse.js"></script>
<script src="../js/pages/traverse.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
