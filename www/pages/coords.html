<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://raw.githubusercontent.com; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
<title>تحويل الإحداثيات</title>
<link rel="icon" href="../icons/icon-192.png" />
<link rel="apple-touch-icon" href="../icons/icon-512.png" />
<meta name="theme-color" content="#1d4ed8" />
<link rel="manifest" href="../manifest.webmanifest" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body data-root="false" data-title="تحويل الإحداثيات" data-page="coords">

<header id="appHeader"></header>
<main>
  <div class="card">
    <div class="btn-row" style="margin-bottom:14px">
      <button type="button" class="btn" id="tabLL">جغرافية ← UTM</button>
      <button type="button" class="btn secondary" id="tabUTM">UTM ← جغرافية</button>
    </div>

    <div id="formLL">
      <h2>خط العرض والطول (WGS84)</h2>
      <div class="row-2">
        <div class="field">
          <label for="latIn">خط العرض Latitude (درجات عشرية)</label>
          <input type="number" step="any" inputmode="decimal" id="latIn" placeholder="24.774265" />
        </div>
        <div class="field">
          <label for="lonIn">خط الطول Longitude (درجات عشرية)</label>
          <input type="number" step="any" inputmode="decimal" id="lonIn" placeholder="46.738586" />
        </div>
      </div>
      <button type="button" class="btn" id="btnLL">تحويل إلى UTM</button>
    </div>

    <div id="formUTM" hidden>
      <h2>إحداثيات UTM</h2>
      <div class="row-2">
        <div class="field">
          <label for="eastIn">Easting (متر)</label>
          <input type="number" step="any" inputmode="decimal" id="eastIn" placeholder="655000" />
        </div>
        <div class="field">
          <label for="northIn">Northing (متر)</label>
          <input type="number" step="any" inputmode="decimal" id="northIn" placeholder="2741000" />
        </div>
      </div>
      <div class="row-2">
        <div class="field">
          <label for="zoneIn">المنطقة Zone (1–60)</label>
          <input type="number" inputmode="numeric" id="zoneIn" placeholder="38" />
        </div>
        <div class="field">
          <label for="hemiIn">نصف الكرة</label>
          <select id="hemiIn"><option value="N">شمالي N</option><option value="S">جنوبي S</option></select>
        </div>
      </div>
      <button type="button" class="btn" id="btnUTM">تحويل إلى خط الطول والعرض</button>
    </div>
  </div>

  <div class="card">
    <h2>النتيجة</h2>
    <div id="messages"></div>
    <div id="headline"></div>
    <div class="result-box empty" id="result">أدخل القيم واضغط تحويل</div>
    <div class="export-bar" id="exportBar" hidden></div>
  </div>
</main>
<nav id="appNav"></nav>

<script src="../js/native-bundle.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/updater.js"></script>
<script src="../js/native-updater.js"></script>
<script src="../js/tools/geo.js"></script>
<script src="../js/pages/coords.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
