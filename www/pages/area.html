<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://raw.githubusercontent.com; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
<title>المساحات والمسافات</title>
<link rel="icon" href="../icons/icon-192.png" />
<link rel="apple-touch-icon" href="../icons/icon-512.png" />
<meta name="theme-color" content="#1d4ed8" />
<link rel="manifest" href="../manifest.webmanifest" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body data-root="false" data-title="المساحات والمسافات" data-page="area">

<header id="appHeader"></header>
<main>
  <div class="card">
    <h2 id="ptFormTitle">إضافة نقطة (Easting / Northing بالمتر)</h2>
    <div class="row-2">
      <div class="field"><label for="ptX">X (Easting)</label>
        <input type="number" step="any" inputmode="decimal" id="ptX" placeholder="0.000" enterkeyhint="next" /></div>
      <div class="field"><label for="ptY">Y (Northing)</label>
        <input type="number" step="any" inputmode="decimal" id="ptY" placeholder="0.000" enterkeyhint="done" /></div>
    </div>
    <div class="btn-row">
      <button type="button" class="btn" id="btnAdd">+ إضافة نقطة</button>
      <button type="button" class="btn secondary" id="btnCancelEdit" hidden>إلغاء التعديل</button>
    </div>
  </div>

  <div class="card">
    <h2>النقاط (<span id="ptCount">0</span>)</h2>
    <svg class="shape-preview" id="preview" viewBox="0 0 300 210" preserveAspectRatio="xMidYMid meet" role="img" aria-label="معاينة شكل المضلع"></svg>
    <div class="points-list" id="ptList"></div>
    <button type="button" class="btn ghost" id="btnClear">حذف كل النقاط</button>
  </div>

  <div class="card">
    <h2>النتائج</h2>
    <div id="messages"></div>
    <div id="headline"></div>
    <div class="result-box empty" id="result">أضف نقطتين على الأقل</div>
    <div class="export-bar" id="exportBar" hidden></div>
  </div>
</main>
<nav id="appNav"></nav>

<script src="../js/native-bundle.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/updater.js"></script>
<script src="../js/native-updater.js"></script>
<script src="../js/tools/area.js"></script>
<script src="../js/pages/area.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
