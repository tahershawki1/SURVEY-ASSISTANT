<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://raw.githubusercontent.com; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
<title>حسابات الميزانية</title>
<link rel="icon" href="../icons/icon-192.png" />
<link rel="apple-touch-icon" href="../icons/icon-512.png" />
<meta name="theme-color" content="#1d4ed8" />
<link rel="manifest" href="../manifest.webmanifest" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body data-root="false" data-title="حسابات الميزانية" data-page="leveling">

<header id="appHeader"></header>
<main>
  <div class="card">
    <h2>منسوب البداية (Benchmark)</h2>
    <div class="field">
      <label for="firstRL">الارتفاع المعروف (متر)</label>
      <input type="number" step="any" inputmode="decimal" id="firstRL" placeholder="100.000" value="100.000" />
    </div>
  </div>

  <div class="card">
    <h2>القراءات (BS / IS / FS)</h2>
    <p class="subtitle" style="margin-bottom:12px">الصف الأول يجب أن يحتوي قراءة خلفية BS. الصف الذي يحمل FS و BS معًا هو نقطة تغيير.</p>
    <div id="rowsWrap"></div>
    <div class="btn-row" style="margin-top:10px">
      <button type="button" class="btn secondary sm" id="btnAddRow">+ إضافة قراءة</button>
      <button type="button" class="btn ghost sm" id="btnResetRows">مسح الجدول</button>
    </div>
  </div>

  <button type="button" class="btn" id="btnCompute" style="margin-bottom:13px">تفريغ المناسيب</button>

  <div class="card">
    <h2>النتيجة</h2>
    <div id="messages"></div>
    <div id="headline"></div>
    <div id="result" class="result-box empty">أدخل القراءات ثم اضغط «تفريغ المناسيب»</div>
    <div class="export-bar" id="exportBar" hidden></div>
  </div>
</main>
<nav id="appNav"></nav>

<script src="../js/native-bundle.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/updater.js"></script>
<script src="../js/native-updater.js"></script>
<script src="../js/tools/leveling.js"></script>
<script src="../js/pages/leveling.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
