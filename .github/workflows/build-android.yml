name: بناء تطبيق أندرويد (APK)

# يبني ملف APK قابل للتثبيت مباشرة (بدون الحاجة لتثبيت Android Studio على جهازك).
# يعمل يدويًا (Run workflow) أو تلقائيًا عند تعديل الإعدادات الأصلية للتطبيق (وليس عند
# كل تحديث في www — تلك التحديثات تصل عبر نظام OTA بدون الحاجة لإعادة بناء APK).
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: true

env:
  # Capacitor CLI 8 يتطلب Node 22 فأعلى — استخدام 20 كان يُفشل خطوة cap sync.
  NODE_VERSION: "22"
  JAVA_VERSION: "21"

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Build native plugin bundle + sync Capacitor
        run: |
          npm run build:native
          npx cap sync android

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        id: apk
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::لم يتم إنتاج ملف APK في المسار المتوقع: $APK"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "حجم الملف: $(du -h "$APK" | cut -f1)"

      - name: Check release signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "مفتاح التوقيع متوفر — سيتم بناء نسخة release موقّعة."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::لم تُضبط أسرار التوقيع (ANDROID_KEYSTORE_BASE64) — سيتم تخطي نسخة release الموقّعة."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          if [ ! -s "$RUNNER_TEMP/signing/release.jks" ]; then
            echo "::error::تعذّر فك ترميز ANDROID_KEYSTORE_BASE64 — تأكد أنه ترميز base64 صالح للملف .jks"
            exit 1
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        env:
          MASAHA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MASAHA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MASAHA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export MASAHA_KEYSTORE_FILE="$RUNNER_TEMP/signing/release.jks"
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify release APK signature
        id: release_apk
        if: steps.signing.outputs.enabled == 'true'
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::لم يتم إنتاج نسخة release الموقّعة في: $APK"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "حجم الملف: $(du -h "$APK" | cut -f1)"

      - name: Remove decoded keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: masaha-assistant-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed release APK as build artifact
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: masaha-assistant-release-apk
          path: ${{ steps.release_apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to a stable Release link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: ${{ steps.apk.outputs.path }}
          RELEASE_APK: ${{ steps.release_apk.outputs.path }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
          TAG: android-debug-latest
          COMMIT_SHA: ${{ github.sha }}
        run: |
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          ASSETS=("$APK")
          if [ "$SIGNED" = "true" ]; then
            ASSETS+=("$RELEASE_APK")
            NOTES=$(printf '%s\n\n%s\n%s' \
              "بُنيت تلقائيًا من commit ${COMMIT_SHA} بتاريخ ${BUILT_AT}." \
              "- \`app-release.apk\` — النسخة الموقّعة، وهي الموصى بها للتثبيت والتوزيع." \
              "- \`app-debug.apk\` — نسخة تجريبية للتشخيص فقط.")
          else
            NOTES="بُنيت تلقائيًا من commit ${COMMIT_SHA} بتاريخ ${BUILT_AT}. هذه نسخة Debug للتجربة والتثبيت اليدوي، وليست موقّعة."
          fi

          # حذف الإصدار والوسم القديمين (إن وُجدا) ثم إنشاء إصدار جديد على نفس الرابط الثابت.
          gh release delete "$TAG" --yes --cleanup-tag || true

          gh release create "$TAG" "${ASSETS[@]}" \
            --target "$COMMIT_SHA" \
            --title "أحدث نسخة أندرويد" \
            --notes "$NOTES"

          if [ "$SIGNED" = "true" ]; then
            echo "رابط النسخة الموقّعة: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-release.apk"
          fi
          echo "رابط نسخة Debug: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-debug.apk"
